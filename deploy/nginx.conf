# Install as /etc/nginx/conf.d/game.conf.
# This standalone configuration REPLACES image-view.conf for the same host.
# Back up/disable image-view.conf before loading this file to avoid duplicate
# server_name declarations on port 80. No extra include directive is needed.
# Game dist contents -> /opt/game/ (expected: /opt/game/index.html).
# Existing image viewer stays in /opt/image-view-front/.
server {
    listen 80;
    server_name sunj2000.com 106.14.136.223;

    location /api/ {
        # No trailing slash: preserve the backend's /api/ prefix.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /image-view {
        return 301 /image-view/$is_args$args;
    }

    location ^~ /image-view/assets/ {
        alias /opt/image-view-front/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /image-view/favicon.svg {
        alias /opt/image-view-front/favicon.svg;
    }

    location = /image-view/index.html {
        alias /opt/image-view-front/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /image-view/ {
        alias /opt/image-view-front/;
        index index.html;
        try_files $uri $uri/ /image-view/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /game {
        return 301 /game/$is_args$args;
    }

    # root /opt + /game/assets/file.js = /opt/game/assets/file.js.
    location ^~ /game/assets/ {
        root /opt;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /game/index.html {
        root /opt;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /game/ {
        root /opt;
        index index.html;
        # Hash route example: /game/#/play/match3.
        # Missing static resources return 404 instead of HTML.
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
